    - {text: "cho mình book 1 bàn tối mai", intents: [create_reservation], slots: {date: "{tomorrow}"}, blocks_any: [ask_slots]}
    - {text: "Tôi muốn đặt chỗ cho 4 người", intents: [create_reservation], slots: {party_size: 4}, blocks_any: [ask_slots]}
    - {text: "tìm quán ăn", intents: [search_restaurant], blocks_any: [ask_slots]}
    - {text: "hủy đơn giúp tôi", intents: [cancel_reservation], blocks_any: [ask_slots]}
    - {text: "doi gio dat ban", intents: [update_reservation], blocks_any: [ask_slots]}

