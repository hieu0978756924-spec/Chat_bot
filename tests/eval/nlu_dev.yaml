    - {text: "toi nay 2 nguoi an do nhat quan 1 luc 8h", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Nhật Bản", area: "Quận 1", party_size: 2, time: "20:00", date: "{today}"}}
    - {text: "Quán nướng Tân Bình, 10 người, trưa mai 12h", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Nướng", area: "Tân Bình", party_size: 10, time: "12:00", date: "{tomorrow}"}}
    - {text: "kiếm chỗ ăn chay rẻ rẻ cho 3 người tối mai", intents: [search_restaurant, check_availability], slots: {cuisine: "Chay", party_size: 3, date: "{tomorrow}"}}
    - {text: "hải sản quận 1 tầm 350 nghìn một người, 4 người, 6 rưỡi tối nay", intents: [search_restaurant, check_availability], slots: {cuisine: "Hải sản", area: "Quận 1", party_size: 4, time: "18:30", date: "{today}"}}
    - {text: "pizza phú nhuận 5 ng 7h tối mai", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Pizza", area: "Phú Nhuận", party_size: 5, time: "19:00", date: "{tomorrow}"}}
    - {text: "Mình cần một quán món Việt ở quận 3, giá bình dân, cho nhóm 8 người vào trưa mai lúc 11 rưỡi", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Món Việt", area: "Quận 3", party_size: 8, time: "11:30", date: "{tomorrow}"}}
    - {text: "lau quan 5 duoi 250k", intents: [search_restaurant], slots: {cuisine: "Lẩu", area: "Quận 5", budget_max: 250000}}

