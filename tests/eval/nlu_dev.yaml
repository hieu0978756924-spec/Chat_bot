# TẬP DEV: 17 nhóm x >= 8 cách diễn đạt (có dấu, không dấu, sai chính tả, câu ngắn, câu dài).
# Được phép dùng để soát lỗi. KHÔNG chép câu nào ở đây vào prompt/few-shot/intent_examples.yaml.
# Mỗi ca: text, intents (chấp nhận 1 trong các intent liệt kê, so với intent CHÍNH của NLU),
#         slots (giá trị phải có trong state sau merge), removed (slot phải bị xóa),
#         clarify: true (phải hỏi lại), confirmation (yes/no), blocks_any (block phản hồi mong đợi).

tim_quan:
  context: none
  cases:
    - {text: "Tìm giúp mình quán lẩu ngon với", intents: [search_restaurant], slots: {cuisine: "Lẩu"}}
    - {text: "co quan sushi nao o quan 1 ko", intents: [search_restaurant], slots: {cuisine: "Nhật Bản", area: "Quận 1"}}
    - {text: "quán nướng", intents: [search_restaurant], slots: {cuisine: "Nướng"}}
    - {text: "Nhà mình 3 thế hệ muốn đi ăn hải sản cuối tuần này, bạn gợi ý chỗ nào ổn với", intents: [search_restaurant], slots: {cuisine: "Hải sản"}}
    - {text: "kím quán pizza ngon ngon", intents: [search_restaurant], slots: {cuisine: "Pizza"}}
    - {text: "ở Phú Nhuận có gì ăn không em", intents: [search_restaurant], slots: {area: "Phú Nhuận"}}
    - {text: "tim nha hang chay quan 1", intents: [search_restaurant], slots: {cuisine: "Chay", area: "Quận 1"}}
    - {text: "Gợi ý vài quán cà phê ngồi nói chuyện được ở quận 5", intents: [search_restaurant], slots: {cuisine: "Cà phê", area: "Quận 5"}}

thuc_don:
  context: none
  cases:
    - {text: "Có những món chay nào vậy?", intents: [search_menu]}
    - {text: "mon nao duoi 100k", intents: [search_menu], slots: {budget_max: 100000}}
    - {text: "Cho em xin menu với giá các món", intents: [search_menu]}
    - {text: "giá món lẩu thái bao nhiu", intents: [search_menu]}
    - {text: "thực đơn", intents: [search_menu]}
