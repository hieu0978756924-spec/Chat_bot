    - {text: "đặt bàn tối nay nha", intents: [create_reservation], slots: {date: "{today}"}, blocks_any: [ask_slots]}
    - {text: "Gợi ý quán đi", intents: [search_restaurant], blocks_any: [ask_slots]}

