# TẬP HELD-OUT: chỉ dùng để ĐO, không dùng để chỉnh prompt / few-shot / câu mẫu dự phòng / luật.
# Gồm 12 câu gốc trong dataset/y_dinh_va_cau_hoi_mau.csv + câu viết mới cho từng nhóm.

csv_goc:
  context: none
  cases:
    - {text: "Tìm nhà hàng lẩu gần Quận 5", intents: [search_restaurant], slots: {cuisine: "Lẩu", area: "Quận 5"}}
    - {text: "Có món nào dưới 100 nghìn không?", intents: [search_menu], slots: {budget_max: 100000}}
    - {text: "Tối mai 19 giờ còn bàn cho 4 người không?", intents: [check_availability, search_restaurant], slots: {date: "{tomorrow}", time: "19:00", party_size: 4}}
    - {text: "Đặt bàn cho 3 người lúc 18 giờ", intents: [create_reservation], slots: {party_size: 3, time: "18:00"}}
    - {text: "Tôi muốn đổi giờ đặt bàn DB001 sang 19 giờ", intents: [update_reservation], slots: {booking_code: DB001, time: "19:00"}}
    - {text: "Hủy giúp tôi mã đặt bàn DB002", intents: [cancel_reservation], slots: {booking_code: DB002}}
    - {text: "Tôi sẽ đến trễ 20 phút", intents: [policy_question, update_reservation]}
    - {text: "Đặt 4 người giờ tăng lên 6 người được không?", intents: [update_reservation, create_reservation], slots: {party_size: 6}}
    - {text: "Tôi đến nơi nhưng nhà hàng không thấy đặt bàn", intents: [complaint]}
    - {text: "Nếu đến trễ thì nhà hàng giữ bàn bao lâu?", intents: [policy_question]}
    - {text: "Nhà hàng này được đánh giá thế nào?", intents: [restaurant_details]}
    - {text: "Tôi muốn nói chuyện với nhân viên", intents: [complaint]}

