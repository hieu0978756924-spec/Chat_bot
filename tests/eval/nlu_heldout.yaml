    - {text: "tim quan nuong duoi 300k cho 6 nguoi toi nay 7h", intents: [search_restaurant, check_availability], slots: {cuisine: "Nướng", budget_max: 300000, party_size: 6, time: "19:00", date: "{today}"}}
    - {text: "Ngày mốt 8 giờ tối, nhóm 2 người, muốn ăn đồ Nhật", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Nhật Bản", party_size: 2, time: "20:00", date: "{d2}"}}
    - {text: "lẩu, quận 5, tối nay, 3 người, 6h30", intents: [search_restaurant, check_availability, create_reservation], slots: {cuisine: "Lẩu", area: "Quận 5", party_size: 3, time: "18:30", date: "{today}"}}
    - {text: "Có quán pizza nào giá dưới 200 nghìn ở Phú Nhuận còn chỗ cho 4 người tối mai không?", intents: [search_restaurant, check_availability], slots: {cuisine: "Pizza", area: "Phú Nhuận", budget_max: 200000, party_size: 4, date: "{tomorrow}"}}

thieu_thong_tin:
