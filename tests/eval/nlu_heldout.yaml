    - {text: "Gần Tân Bình có chỗ nào nướng ngon?", intents: [search_restaurant], slots: {cuisine: "Nướng", area: "Tân Bình"}}
    - {text: "quán hải sản tươi", intents: [search_restaurant], slots: {cuisine: "Hải sản"}}
    - {text: "Chiều nay muốn đi uống cà phê, có chỗ nào quận 5 không", intents: [search_restaurant], slots: {cuisine: "Cà phê", area: "Quận 5"}}

