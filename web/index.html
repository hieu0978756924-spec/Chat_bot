<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableNow</title>
<style>
  :root {
    --blue-900: #0d47a1;
    --blue-700: #1565c0;
    --blue-600: #1e88e5;
    --blue-400: #42a5f5;
    --blue-100: #e3f2fd;
    --blue-50:  #f1f8ff;
    --text: #1f2937;
    --muted: #6b7280;
    --bot-bg: #ffffff;
    --page-bg: #eaf3fc;
    --chat-bg: #f4f8fd;
    --shadow: 0 12px 40px rgba(13, 71, 161, .18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text);
  }

  /* ---------- trang nền ---------- */
  .hero {
    max-width: 640px; margin: 0 auto; padding: 72px 24px 24px;
  }
  .hero h1 { margin: 0 0 8px; font-size: 34px; color: var(--blue-900); letter-spacing: -.5px; }
  .hero p { margin: 0 0 6px; color: var(--muted); line-height: 1.6; }

  /* ---------- khung chat ---------- */
  .chat {
    position: fixed; right: 28px; bottom: 28px;
    width: 400px; height: min(640px, calc(100vh - 56px));
    display: flex; flex-direction: column;
    background: var(--chat-bg);
    border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow);
    transform-origin: bottom right;
    transition: transform .2s ease, opacity .2s ease;
  }
  .chat.closed { transform: scale(.6); opacity: 0; pointer-events: none; }

  .chat-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 16px 18px;
    background: linear-gradient(120deg, var(--blue-700), var(--blue-600) 55%, var(--blue-400));
    color: #fff;
  }
  .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: #fff; display: grid; place-items: center;
  }
  .avatar svg { width: 26px; height: 26px; }
  .head-text { flex: 1; min-width: 0; }
  .head-text .name { font-weight: 700; font-size: 18px; line-height: 1.2; }
  .head-text .sub { font-size: 13px; opacity: .9; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #69f0ae; display: inline-block; }
  .icon-btn {
    flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: transparent; color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,.18); }
  .icon-btn svg { width: 22px; height: 22px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px 14px 8px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%; padding: 12px 15px; font-size: 14.5px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
    animation: pop .18s ease;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bot-bg);
    border-radius: 18px 18px 18px 6px;
    box-shadow: 0 1px 3px rgba(15, 40, 80, .08);
  }
  .msg.user {
    align-self: flex-end; color: #fff;
    background: linear-gradient(135deg, var(--blue-600), var(--blue-400));
    border-radius: 18px 18px 6px 18px;
  }
  .msg .meta { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .msg.system {
    align-self: center; background: var(--blue-100); color: var(--blue-700);
    font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue-400);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  .typing-note { margin-left: 8px; font-size: 12.5px; color: var(--muted); }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 10px; }
  .chip {
    border: 1px solid #bbdefb; background: #fff; color: var(--blue-700);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { background: var(--blue-50); }

  .composer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 8px; background: #fff; border-top: 1px solid #e5edf6;
  }
  .composer input {
    flex: 1; min-width: 0; height: 48px; padding: 0 18px;
    border: 2px solid var(--blue-400); border-radius: 999px;
    font: inherit; font-size: 15px; color: var(--text); outline: none;
  }
  .composer input:focus { border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(30,136,229,.15); }
  .send {
    flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-600), var(--blue-400));
    color: #fff; cursor: pointer; display: grid; place-items: center;
    transition: opacity .15s, transform .15s;
  }
  .send:hover:not(:disabled) { transform: scale(1.05); }
  .send:disabled { opacity: .45; cursor: default; }
  .send svg { width: 22px; height: 22px; }
  .foot { text-align: center; font-size: 11.5px; color: var(--muted); background: #fff; padding: 0 0 10px; }

  /* nút mở lại khung chat */
  .launcher {
    position: fixed; right: 28px; bottom: 28px; width: 62px; height: 62px;
    border: 0; border-radius: 50%; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--blue-700), var(--blue-400));
    box-shadow: var(--shadow); display: none; place-items: center;
  }
  .launcher.show { display: grid; }
  .launcher svg { width: 30px; height: 30px; }

  @media (max-width: 520px) {
    .chat { right: 0; bottom: 0; width: 100%; height: 100%; border-radius: 0; }
    .hero { display: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>TableNow</h1>
  <p>Trợ lý đặt bàn nhà hàng tại Quy Nhơn: tìm quán theo món và phong cách ẩm thực, kiểm tra bàn trống, đặt, đổi, hủy bàn và giải đáp chính sách.</p></div>

<section class="chat" id="chat" aria-label="Khung chat TableNow">
  <header class="chat-head">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>
      </svg>
    </div>
    <div class="head-text">
      <div class="name">Chat với TableNow</div>
      <div class="sub"><span class="dot"></span>Luôn sẵn sàng hỗ trợ</div>
    </div>
    <button class="icon-btn" id="btnNew" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnClose" title="Đóng" aria-label="Đóng khung chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </header>

  <div class="messages" id="messages" aria-live="polite"></div>

  <div class="chips" id="chips">
    <button class="chip">Tìm quán lẩu ở Quy Nhơn</button>
    <button class="chip">Có quán món Ý nào không?</button>
    <button class="chip">Tối mai còn bàn 4 người lúc 19h không?</button>
    <button class="chip">Chính sách phí hủy đơn như thế nào?</button>
  </div>

  <form class="composer" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Nhập tin nhắn..." maxlength="1000" aria-label="Nhập tin nhắn">
    <button class="send" id="send" type="submit" aria-label="Gửi" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </form>
  <div class="foot">TableNow · Local LLM</div>
</section>

<button class="launcher" id="launcher" aria-label="Mở khung chat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>
  </svg>
</button>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const box = $("messages"), input = $("input"), send = $("send"), chips = $("chips");
  let sid = newSid();
  let busy = false;

  function newSid() {
    return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function add(text, who, meta) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    if (meta) {
      const m = document.createElement("span");
      m.className = "meta";
      m.textContent = meta;
      el.appendChild(m);
    }
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return el;
  }

  function typing() {
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span><span class="typing-note">Đang xử lý…</span>';
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return el;
  }

  function setBusy(v) {
    busy = v;
    input.disabled = v;
    send.disabled = v || !input.value.trim();
    if (!v) input.focus();
  }

  async function greet() {
    const t = typing();
    try {
      const r = await fetch("/api/greeting?sid=" + encodeURIComponent(sid));
      const d = await r.json();
      t.remove();
      add(d.reply, "bot");
    } catch (e) {
      t.remove();
      add("Không kết nối được máy chủ chatbot. Bạn kiểm tra cửa sổ đang chạy server nhé.", "system");
    }
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    chips.style.display = "none";
    add(text, "user");
    input.value = "";
    setBusy(true);
    const t = typing();
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid: sid, message: text })
      });
      const d = await r.json();
      t.remove();
      add(d.reply, "bot", d.latency_s != null ? d.latency_s + " giây" : "");
    } catch (e) {
      t.remove();
      add("Mất kết nối tới máy chủ chatbot. Bạn thử lại sau nhé.", "system");
    }
    setBusy(false);
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener("input", () => { send.disabled = busy || !input.value.trim(); });
  chips.addEventListener("click", (e) => { if (e.target.classList.contains("chip")) ask(e.target.textContent); });

  $("btnNew").addEventListener("click", async () => {
    if (busy) return;
    sid = newSid();
    box.innerHTML = "";
    chips.style.display = "";
    add("Đã bắt đầu cuộc trò chuyện mới", "system");
    await greet();
  });
  $("btnClose").addEventListener("click", () => {
    $("chat").classList.add("closed");
    $("launcher").classList.add("show");
  });
  $("launcher").addEventListener("click", () => {
    $("chat").classList.remove("closed");
    $("launcher").classList.remove("show");
    input.focus();
  });

  greet();
  input.focus();
})();
</script>
</body>
</html>
